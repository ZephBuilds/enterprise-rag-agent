name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python3 -m compileall -q src tests

      - name: Run canonical offline verification
        run: PYTHONPATH=src python3 -m enterprise_rag.cli verify

  container-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build container without network access
        run: docker build --network none --tag enterprise-rag-agent:ci .

      - name: Run container without network access
        run: docker run --rm --network none enterprise-rag-agent:ci
